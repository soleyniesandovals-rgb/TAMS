<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TAMS — Recuperar contraseña</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/acceso.css">
</head>
<body class="tema-docente pagina-recuperar-nueva">
  <main class="pantalla-publica">
    <div class="acceso acceso-fijo">
      <div class="acceso-panel">
        <section class="acceso-panel-cara panel-cara-login">
          <h1 class="titulo-publico">Introduce tu nueva contraseña</h1>
          <p class="texto-publico">Guarda tu contraseña en un lugar seguro y no la compartas con nadie</p>
        </section>
      </div>
      <section class="acceso-formulario acceso-formulario-login" aria-labelledby="titulo-formulario">
        <h2 class="acceso-titulo" id="titulo-formulario">Restablece tu contraseña</h2>
        <!-- JS: comprobará que ambas contraseñas coincidan y enviará el código y la contraseña nueva (POST /api/cuentas/recuperacion/confirmar) -->
        <form id="form-recuperar-nueva" data-js="recuperar-nueva">
          <div class="campo">
            <label class="campo-etiqueta" for="nueva-contrasena">Contraseña</label>
            <input class="campo-entrada" id="nueva-contrasena" name="contrasenaNueva" type="password" autocomplete="new-password" placeholder="123456...." required>
          </div>
          <div class="campo">
            <label class="campo-etiqueta" for="nueva-repetir">Repetir contraseña</label>
            <input class="campo-entrada" id="nueva-repetir" name="repetirContrasena" type="password" autocomplete="new-password" placeholder="123456...." required>
          </div>
          <div class="acceso-enviar">
            <a class="boton boton-principal" href="index.html">Confirmar</a>
          </div>
        </form>
      </section>
    </div>
  </main>
</body>
</html>
