<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TAMS — Recuperar contraseña — Nueva contraseña</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="tema-docente">
  <main class="pantalla-publica">
    <div class="tarjeta-publica">
      <section class="panel-publicitario">
        <h1 class="titulo-publico">Introduce tu nueva contraseña</h1>
        <p class="texto-publico">Paso 3 de 3. Usa una contraseña que no hayas usado antes.</p>
        <p class="texto-publico">¿Quieres empezar de nuevo? <a class="enlace-publico" href="index.html">Inicia sesión</a></p>
        <a class="boton boton-secundario" href="index.html">Volver al inicio de sesión</a>
      </section>

      <section class="panel-formulario">
        <h2 class="titulo-seccion">Nueva contraseña</h2>

        <!-- JS: comprobará que ambas contraseñas coincidan y enviará el cambio a la API -->
        <form class="formulario-publico" data-js="recuperar-nueva">
          <div class="campo">
            <label class="campo-etiqueta" for="nueva-contrasena">Contraseña nueva</label>
            <input class="campo-entrada" id="nueva-contrasena" name="contrasena" type="password" autocomplete="new-password" required>
          </div>

          <div class="campo">
            <label class="campo-etiqueta" for="nueva-contrasena-repetir">Repetir contraseña</label>
            <input class="campo-entrada" id="nueva-contrasena-repetir" name="repetirContrasena" type="password" autocomplete="new-password" required>
            <span class="campo-ayuda">Ambas contraseñas deben ser iguales.</span>
          </div>

          <div class="formulario-acciones">
            <a class="enlace-publico" href="recuperar-codigo.html">Atrás</a>
            <!-- JS: en la maqueta vuelve a index.html; después confirmará el cambio con la API -->
            <a class="boton boton-principal" href="index.html">Confirmar</a>
          </div>
        </form>

        <div id="mensaje-recuperar-nueva" class="mensaje mensaje-exito" hidden>
          <p>Contraseña actualizada. Ya puedes iniciar sesión.</p>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
