<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TAMS — Recuperar contraseña</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/acceso.css">
</head>
<body class="tema-docente pagina-recuperar-codigo">
  <main class="pantalla-publica">
    <div class="acceso acceso-fijo">
      <div class="acceso-panel">
        <section class="acceso-panel-cara panel-cara-login">
          <h1 class="titulo-publico">Introduce el código que enviamos a tu correo</h1>
          <p class="texto-publico">Luego podrás restablecer tu contraseña</p>
        </section>
      </div>
      <section class="acceso-formulario acceso-formulario-login" aria-labelledby="titulo-formulario">
        <h2 class="acceso-titulo" id="titulo-formulario">Recuperar contraseña</h2>
        <!-- JS: guardará el código para enviarlo en el paso 3 junto con la contraseña nueva (la API no lo comprueba por separado) -->
        <form id="form-recuperar-codigo" data-js="recuperar-codigo">
          <div class="campo">
            <label class="campo-etiqueta" for="recuperar-codigo-campo">Ingresa el código</label>
            <input class="campo-entrada" id="recuperar-codigo-campo" name="codigo" type="text" inputmode="text" autocomplete="one-time-code" required>
          </div>
          <div class="acceso-enviar">
            <button class="boton boton-principal" type="submit">Siguiente</button>
          </div>
        </form>
        <p class="mensaje" data-js="mensaje-recuperar-codigo" hidden></p>
      </section>
    </div>
  </main>
  <script type="module" src="js/recuperacion.js"></script>
</body>
</html>
