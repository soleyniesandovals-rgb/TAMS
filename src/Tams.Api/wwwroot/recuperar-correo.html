<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TAMS — Recuperar contraseña</title>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/acceso.css">
</head>
<body class="tema-docente pagina-recuperar-correo">
  <main class="pantalla-publica">
    <div class="acceso acceso-fijo">
      <div class="acceso-panel">
        <section class="acceso-panel-cara panel-cara-login">
          <h1 class="titulo-publico">Busca tu dirección de correo electrónico</h1>
          <p class="texto-publico">Enviaremos un código para restablecer la contraseña, no lo compartas con nadie</p>
        </section>
      </div>
      <section class="acceso-formulario acceso-formulario-login" aria-labelledby="titulo-formulario">
        <h2 class="acceso-titulo" id="titulo-formulario">Recuperar contraseña</h2>
        <!-- JS: pedirá a la API que envíe el código de recuperación (POST /api/cuentas/recuperacion/iniciar) -->
        <form id="form-recuperar-correo" data-js="recuperar-correo">
          <div class="campo">
            <label class="campo-etiqueta" for="recuperar-correo">Correo electrónico</label>
            <input class="campo-entrada" id="recuperar-correo" name="correo" type="email" autocomplete="email" placeholder="Ejemplo@gmail.com" required>
          </div>
          <div class="acceso-enviar">
            <button class="boton boton-principal" type="submit">Siguiente</button>
          </div>
        </form>
        <p class="mensaje" data-js="mensaje-recuperar-correo" hidden></p>
      </section>
    </div>
  </main>
  <script type="module" src="js/recuperacion.js"></script>
</body>
</html>
